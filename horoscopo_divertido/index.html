<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horóscopo por Horas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e1065">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;600&family=Space+Grotesk:wght@300;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="app">
        <header>
            <div class="logo">🔮</div>
            <h1>Horóscopo<br><span>(Por Horas)</span></h1>
            <p>Elige tu signo y prepárate para la verdad.</p>
            
            <!-- Selector de Modo -->
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="hourly">Por Horas</button>
                <button class="mode-btn" data-mode="daily">Diario</button>
                <button class="mode-btn" data-mode="weekly">Semanal</button>
            </div>

            <!-- Toggle Zodiaco -->
            <div class="zodiac-toggle">
                <button class="toggle-btn active" data-zodiac="western">♈ Occidental</button>
                <button class="toggle-btn" data-zodiac="chinese">🐉 Chino</button>
            </div>
        </header>

        <div class="zodiac-grid" id="grid">
            <!-- Generated by JS -->
        </div>

        <footer>
            <p>100% Pseudo-ciencia garantizada</p>
            <button class="history-btn" id="history-btn">📜 Ver Historial</button>
        </footer>
    </div>

    <!-- Modal de Resultado -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" id="close">&times;</button>
            <div class="modal-icon" id="result-icon">♒</div>
            <h2 id="result-sign">Acuario</h2>
            <div class="mode-badge" id="mode-badge">📅 Por Horas</div>
            
            <div class="loader hidden" id="loader">
                <div class="crystal-ball">✨</div>
                <p>Consultando a los astros...</p>
            </div>
            
            <div id="result-text-container">
                <p class="prediction" id="prediction">...</p>
                
                <div class="extra-info">
                    <div class="lucky-number">
                        <span>Número de la mala suerte:</span>
                        <strong id="lucky-num">13</strong>
                    </div>
                    
                    <div class="mood">
                        <span>Tu humor de hoy:</span>
                        <strong id="mood-text">...</strong>
                    </div>
                    
                    <div class="lucky-color">
                        <span>Color del día:</span>
                        <strong id="lucky-color">...</strong>
                        <span class="color-swatch" id="color-swatch"></span>
                    </div>
                </div>

                <div class="compatibility" id="compatibility">
                    <p>Hoy te llevas <span id="comp-level">...</span> con <span id="comp-sign">...</span></p>
                </div>

                <button class="share-btn" id="share-btn">📤 Compartir Predicción</button>
            </div>
        </div>
    </div>

    <!-- Modal de Historial -->
    <div id="history-modal" class="modal hidden">
        <div class="modal-content">
            <button class="close-btn" id="close-history">&times;</button>
            <h2>📜 Tu Historial</h2>
            <div class="history-list" id="history-list">
                <!-- Generated by JS -->
            </div>
            <button class="clear-history-btn" id="clear-history-btn">🗑️ Limpiar Historial</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>

</html>
