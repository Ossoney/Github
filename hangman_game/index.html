<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Hangman 2077</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-grid"></div>
    <div class="scanlines"></div>

    <div class="game-container">
        <!-- HEADER -->
        <header>
            <h1 class="glitch-text" data-text="CYBER HANGMAN">CYBER HANGMAN</h1>
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="label">SCORE:</span>
                    <span id="score-val" class="value">0000</span>
                </div>
                <div class="stat-item">
                    <span class="label">CAT:</span>
                    <span id="category-val" class="value">SYSTEM</span>
                </div>
            </div>
        </header>

        <!-- MAIN AREA: DRAWING & WORD -->
        <main>
            <div class="drawing-area">
                <svg viewBox="0 0 200 250" class="gallow-svg">
                    <!-- Base Structure -->
                    <line x1="20" y1="230" x2="180" y2="230" class="draw-path base" />
                    <line x1="50" y1="230" x2="50" y2="20" class="draw-path pole" />
                    <line x1="50" y1="20" x2="120" y2="20" class="draw-path top" />
                    <line x1="120" y1="20" x2="120" y2="50" class="draw-path rope" />

                    <!-- The Victim (Hidden by default) -->
                    <circle cx="120" cy="70" r="20" class="draw-part part-0" /> <!-- Head -->
                    <line x1="120" y1="90" x2="120" y2="150" class="draw-part part-1" /> <!-- Body -->
                    <line x1="120" y1="110" x2="90" y2="130" class="draw-part part-2" /> <!-- Left Arm -->
                    <line x1="120" y1="110" x2="150" y2="130" class="draw-part part-3" /> <!-- Right Arm -->
                    <line x1="120" y1="150" x2="100" y2="190" class="draw-part part-4" /> <!-- Left Leg -->
                    <line x1="120" y1="150" x2="140" y2="190" class="draw-part part-5" /> <!-- Right Leg -->
                </svg>
            </div>

            <div class="word-display" id="word-display">
                <!-- Letters injected here -->
            </div>
        </main>

        <!-- KEYBOARD -->
        <div class="keyboard" id="keyboard">
            <!-- Keys injected by JS -->
        </div>

        <!-- MODALS -->
        <div id="modal-screen" class="modal hidden">
            <div class="modal-content">
                <h2 id="modal-title" class="neon-pink">SYSTEM FAILURE</h2>
                <p id="modal-msg">TERMINAL LOCKED</p>
                <p class="word-reveal">TARGET: <span id="target-word">SECRET</span></p>
                <button id="btn-restart" class="cyber-btn">REBOOT SYSTEM</button>
            </div>
        </div>

        <div id="start-screen" class="modal">
            <div class="modal-content">
                <h2 class="neon-blue">INITIALIZE</h2>
                <p>SELECT DATABASE</p>
                <div class="category-grid">
                    <button class="cat-btn" data-cat="movies">MOVIES_DB</button>
                    <button class="cat-btn" data-cat="tech">TECH_STACK</button>
                    <button class="cat-btn" data-cat="countries">GEO_DATA</button>
                    <button class="cat-btn" data-cat="random">RND_ACCESS</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
